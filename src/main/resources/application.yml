spring:
  application:
    name: Expense Splitter App
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: expenseSplitterDb
      #it will automatically create indexes in document fields:
      auto-index-creation: true
  main:
    allow-circular-references: true

exchange-rate-getter:
  api:
    key: ${ERG_API_KEY}

reactjs-frontend:
  origin: ${REACTJS_FRONTEND_ORIGIN}