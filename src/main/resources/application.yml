spring:
  application:
    name: Expense Splitter App
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: expenseSplitterDb
      #it will automatically create indexes in document fields:
      auto-index-creation: true
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    tomcat:
      max-http-form-post-size: 10485760 # 10MB in bytes
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${JAVA_EMAIL}
    password: ${JAVA_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          #For Encryption Purposes (TLS Methods) (Start Transport Layer Security):
          starttls:
            enable: true


exchange-rate-getter:
  api:
    key: ${ERG_API_KEY}

reactjs-frontend:
  origin: ${REACTJS_FRONTEND_ORIGIN}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

admin-empids: ${ADMIN_EMPIDS}